(function(){
var NS = window.GarberAutomotiveDesignSystem_f79ede || {};
function mountAll(){ document.querySelectorAll('.ds-mount:not([data-mounted])').forEach(function(el){ el.setAttribute('data-mounted','1');
var comp = NS[el.getAttribute('data-comp')]; if(!comp) return;
var props = {}; try { props = JSON.parse(el.getAttribute('data-props')||'{}'); } catch(e){}
try { ReactDOM.createRoot(el).render(React.createElement(comp, props)); } catch(e) { console.error(e); }
}); }
function route(){
var id = (location.hash||'#about').slice(1); if(!document.getElementById(id)) id='about';
document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id===id); });
document.querySelectorAll('.site-nav a').forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-page')===id); });
document.title = 'Garber Buick — ' + document.getElementById(id).getAttribute('data-title'); window.scrollTo(0,0);
}
Promise.all(Array.prototype.map.call(document.querySelectorAll('.page[data-src]'), function(p){ return fetch(p.getAttribute('data-src')).then(function(r){ return r.text(); }).then(function(h){ p.innerHTML=h; }); })).then(function(){ mountAll(); route(); });
window.addEventListener('hashchange', route);
var modal=document.getElementById('video-modal'), player=document.getElementById('player'), yt=document.getElementById('video-yt');
function openVideo(id, src){
player.innerHTML='';
if(src){ var v=document.createElement('video'); v.src=src; v.controls=true; v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline',''); player.appendChild(v); v.play().catch(function(){}); }
else { var f=document.createElement('iframe'); f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0'; f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true; player.appendChild(f); }
yt.href='https://www.youtube.com/shorts/'+id; modal.classList.add('open'); document.body.style.overflow='hidden';
}
function closeVideo(){ modal.classList.remove('open'); player.innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('click', function(e){ var a=e.target.closest('.js-video'); if(!a) return; e.preventDefault(); openVideo(a.getAttribute('data-video'), a.getAttribute('data-src')); });
document.getElementById('video-close').addEventListener('click', closeVideo);
modal.addEventListener('click', function(e){ if(e.target===modal) closeVideo(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeVideo(); });
})();
</script></body></html>
